name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run browser:install -- --with-deps
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:safe-area
      - run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:safe-area:headed
